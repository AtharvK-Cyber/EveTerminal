<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3748"/>
      <stop offset="100%" stop-color="#1A202C"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="titleBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Rounded Monitor Frame -->
  <rect x="16" y="20" width="224" height="216" rx="24" fill="url(#frameGrad)" stroke="#4A5568" stroke-width="4" filter="url(#shadow)"/>

  <!-- Screen Bezel -->
  <rect x="28" y="32" width="200" height="172" rx="14" fill="url(#screenGrad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Tab Bar Area -->
  <rect x="28" y="32" width="200" height="28" rx="14" fill="#1E293B"/>
  <rect x="28" y="46" width="200" height="14" fill="#1E293B"/>

  <!-- Tab 1: R1 (Active) -->
  <path d="M 36 60 L 36 40 A 6 6 0 0 1 42 34 L 88 34 A 6 6 0 0 1 94 40 L 94 60 Z" fill="#0F172A"/>
  <circle cx="46" cy="47" r="3" fill="#10B981"/>
  <text x="56" y="52" fill="#F8FAFC" font-family="monospace, sans-serif" font-weight="bold" font-size="11">R1</text>

  <!-- Tab 2: R2 -->
  <path d="M 98 60 L 98 42 A 4 4 0 0 1 102 38 L 140 38 A 4 4 0 0 1 144 42 L 144 60 Z" fill="#334155"/>
  <text x="114" y="52" fill="#94A3B8" font-family="monospace, sans-serif" font-size="11">R2</text>

  <!-- Tab 3: R3 -->
  <path d="M 148 60 L 148 42 A 4 4 0 0 1 152 38 L 190 38 A 4 4 0 0 1 194 42 L 194 60 Z" fill="#334155"/>
  <text x="164" y="52" fill="#94A3B8" font-family="monospace, sans-serif" font-size="11">R3</text>

  <!-- Window controls -->
  <circle cx="216" cy="46" r="3.5" fill="#EF4444"/>

  <!-- Terminal Content Area -->
  <!-- Prompt line -->
  <text x="40" y="86" fill="#10B981" font-family="monospace, Courier" font-weight="bold" font-size="13">R1#</text>
  <text x="72" y="86" fill="#F8FAFC" font-family="monospace, Courier" font-size="13">show ip int br</text>

  <text x="40" y="106" fill="#94A3B8" font-family="monospace, Courier" font-size="11">Interface   IP-Address    Status</text>
  <text x="40" y="124" fill="#38BDF8" font-family="monospace, Courier" font-size="11">Fa0/0       10.0.0.1      up</text>
  <text x="40" y="142" fill="#38BDF8" font-family="monospace, Courier" font-size="11">Fa0/1       192.168.1.1   up</text>

  <!-- Next prompt with cursor -->
  <text x="40" y="168" fill="#10B981" font-family="monospace, Courier" font-weight="bold" font-size="13">R1#</text>
  <rect x="74" y="156" width="9" height="15" fill="#10B981" opacity="0.85"/>

  <!-- Status / Brand Badge at Bottom -->
  <rect x="40" y="212" width="176" height="14" rx="4" fill="#1E293B"/>
  <circle cx="50" cy="219" r="3" fill="#10B981"/>
  <text x="60" y="222" fill="#94A3B8" font-family="sans-serif" font-size="9" font-weight="bold">SECURE CRT LINUX</text>
  <text x="178" y="222" fill="#64748B" font-family="sans-serif" font-size="9">DEBIAN</text>
</svg>
