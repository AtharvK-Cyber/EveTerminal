[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eveterminal"
version = "1.0.0"
description = "Multi-tab & horizontal tiled terminal client for EVE-NG, GNS3, and Cisco labs"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyQt6>=6.4.0",
    "paramiko>=2.10.0",
    "pyserial>=3.5",
]

[project.scripts]
eveterminal = "eveterminal.app:main"
securecrt-linux = "eveterminal.app:main"
